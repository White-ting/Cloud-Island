<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>云岛</title>
<!-- 开屏字幕的字体：英文 Didot（系统自带），中文霞鹜文楷 Light（切片放在同一层，sw.js 会缓存；许可见同层 LXGW-WenKai-OFL.txt） -->
<link rel="stylesheet" href="lxgwwenkai-light.css">
<!-- 防闪：页面的大段脚本跑完之前，浏览器会先按默认样子画一遍；连上后端之前，聊天区会先画小样的假数据。
     所以：boot = 脚本跑完之前整页不画，底色先按存着的主题（跟 bgSet 同一套算法）铺好；
     wait = 从网址打开时（可能连得上后端），聊天区和顶上名字先藏着，连上并取到 AI 名单再露出来；连不上才给小样看 -->
<script>(function(){var d=document.documentElement;d.classList.add('boot');if(/^https?:$/.test(location.protocol))d.classList.add('wait');
try{var b=localStorage.getItem('fe-bg2');if(b==null)b='';if(localStorage.getItem('fe-plain')==='1')b='';var k=localStorage.getItem('fe-sk');if(k==null)k='b';var hk=location.hash.match(/sk([a-d0])/);if(hk)k=hk[1]==='0'?'':hk[1];if(localStorage.getItem('fe-plain')==='1')k='';if(/^[a-d]$/.test(k))b='s'+k;
if(b==='auto'){var n=new Date(),t=n.getHours()+n.getMinutes()/60;b=t<5?'d':t<8.5?'c':t<17?'a':t<19.5?'b':'d';}d.setAttribute('data-boot-bg',b||'w');}catch(e){}
setTimeout(function(){d.classList.remove('boot');},10000);setTimeout(function(){d.classList.remove('wait');},25000);})();</script>
<!-- wait 的兜底是 25 秒（问后端最多等 8+12 秒，没到就露出来会先看到假数据）；boot 的兜底是 10 秒 -->
<!-- 云岛：迎接页 + 聊天页，一张网页。没连上后端时整页是小样（假数据），只能看样子。
     登入后「登入」那一块换成小摆件，桌宠坐在上面；按住摆件往上推，迎接页被推走并淡出，桌宠掉到输入框上。
     网址后面加 #in 直接看登入后的样子，#in1 / #in5 / #in7 换摆件（截图用）。 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html.boot body{visibility:hidden}
html.boot[data-boot-bg=a]{background:#cddff4}html.boot[data-boot-bg=b]{background:#f1d3cc}html.boot[data-boot-bg=c]{background:#e6eaf1}html.boot[data-boot-bg=d]{background:#1a2050}html.boot[data-boot-bg=sa]{background:#f4eee2}html.boot[data-boot-bg=sb]{background:#e9f1f0}html.boot[data-boot-bg=sc]{background:#15181d}html.boot[data-boot-bg=sd]{background:#fbfbfa}
html.wait #log,html.wait #ainame,html.wait #ainame+i{visibility:hidden}
html,body{height:100%;overflow:hidden;background:#f2f2f7}
html,body{overscroll-behavior:none}   /* 整页不跟着下拉回弹，聊天记录自己那块照样滑 */
html.boot[data-boot-bg] body{background:transparent}   /* 这个标记别叫 data-bg：会跟设置页「换背景」那几行的 [data-bg] 撞 */
body{font-family:-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;color:#111;user-select:none;-webkit-user-select:none}
button{font:inherit;border:0;background:none;color:inherit}

/* 主题：a 晴 b 晚霞 c 晨雾 d 夜（没有 = 白底，默认）。迎接页和聊天页是同一片天：推开迎接页，底下是同一个天空淡一层。天空是渐变 */
body{--c-ink:#111;--c-mute:#8e8e93;--c-ai:#fff;--c-aiink:#111;--c-me:#111;--c-meink:#fff;--c-glass:#fff;--c-wash:none;--far:#fff;--bank:#fff}
body.th-a{--sky:linear-gradient(#79aae9,#8cb8ee,#a8cbf4,#c6ddf7,#e2edfb);--c-ink:#16345c;--c-mute:#5f7ea6;--c-ai:rgba(255,255,255,.74);--c-aiink:#16345c;--c-me:#3f78c4;--c-meink:#fff;--c-glass:rgba(255,255,255,.7);--c-wash:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.62));--far:#f2f7fd;--bank:#ffffff}
body.th-b{--sky:linear-gradient(#7d81c5,#a38ac5,#d19dbc,#f3baae,#feddc1);--c-ink:#4a2d52;--c-mute:#8d6a8e;--c-ai:rgba(255,255,255,.72);--c-aiink:#4a2d52;--c-me:#a9628a;--c-meink:#fff;--c-glass:rgba(255,255,255,.68);--c-wash:linear-gradient(rgba(255,250,248,.3),rgba(255,246,240,.55));--far:#ffe0d2;--bank:#fff1e6}
body.th-c{--sky:linear-gradient(#d2dff5,#d8e3f7,#e4ebf8,#edeff7,#f6f3f4);--c-ink:#1c2333;--c-mute:#7c8496;--c-ai:rgba(255,255,255,.8);--c-aiink:#1c2333;--c-me:#4b5d82;--c-meink:#fff;--c-glass:rgba(255,255,255,.78);--c-wash:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.45));--far:#ffffff;--bank:#ffffff}
body.th-d{--c-pop:rgba(34,40,88,.94);--sky:linear-gradient(#131938,#171f45,#222c5d,#3a4078,#565996);--c-ink:#eef0ff;--c-mute:rgba(230,234,255,.6);--c-ai:rgba(255,255,255,.13);--c-aiink:#eef0ff;--c-me:rgba(255,255,255,.9);--c-meink:#1a2046;--c-glass:rgba(255,255,255,.14);--c-wash:linear-gradient(rgba(8,12,34,.25),rgba(8,12,34,.45));--far:#5a64a8;--bank:#6e74b4}
#chat{position:fixed;inset:0;display:flex;flex-direction:column;background:#f2f2f7;color:var(--c-ink)}
body[class*="th-"] #chat{background:var(--c-wash),var(--sky) center bottom/cover}
#csky{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.6}
#cbank{position:absolute;left:0;right:0;bottom:0;height:150px;width:100%;pointer-events:none;display:none}
body[class*="th-"] #cbank{display:block}
.bar{position:relative}
.bar{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:600}
.bar span,.bar button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--c-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--c-ink)}
.bar button{font-size:12px;font-weight:400}
.bar [hidden]{display:none}
#log{position:relative;flex:1;overflow-y:auto;padding:8px 16px 30px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.day{font-size:12px;color:var(--c-mute);text-align:center}
.callrec{font-size:13px}
/* 运行过的卡片/组件：聊天里只留一行；点开是一张小卡，像一页剧本（谁 | 说了什么） */
.runrec{margin:2px 0;text-align:center}
.runrec>.day{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--c-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12px;color:var(--c-mute)}
.runrec>.day svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.runrec>.day i{font-style:normal;font-size:13px;transition:transform .2s}
.runrec.open>.day i{transform:rotate(90deg)}
/* 思考一行、步骤/小记/散场记一行（跟组件那行一个样子）、拍一拍 */
.pre{display:flex;flex-direction:column;gap:8px;margin-bottom:-8px}
.thk{align-self:flex-start;max-width:100%;min-height:30px;padding:0 6px;display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.55;color:var(--c-mute);text-align:left}
body.noav-ai .thk{min-height:0}
.thk svg{flex:none;width:15px;height:15px;fill:none;stroke:var(--av,#f0a35e);stroke-width:2;stroke-linecap:round}
.thk.open svg{float:left;margin:2px 6px 0 0}
.col>.strec{align-self:flex-start;width:calc(100vw - 32px);margin-left:-46px}   /* 46 = 头像 38 + 间距 8：小记、散场记那条不跟着头像缩进，整行居中 */
body.noav-ai .col>.strec{margin-left:0}
/* 运行那条不做成气泡，跟思考一样：左对齐、没底、小字；展开的那张也靠左 */
.strec[data-rec=steps],.col>.strec[data-rec=steps]{align-self:flex-start;width:100%;margin-left:0;text-align:left}
.strec[data-rec=steps]>.day{height:auto;min-height:30px;padding:0 6px;border-radius:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:12.5px;gap:6px}
.strec[data-rec=steps]>.day svg{width:15px;height:15px;stroke:var(--av,#f0a35e);stroke-width:2}
.strec[data-rec=steps] .runlog{margin:4px 0 0;width:100%}
/* 步骤名太长（长命令这类）会把整页撑宽：一行放不下就截成「…」，点开的输入输出折行 */
.strec[data-rec=steps]{min-width:0;max-width:100%}
.strec[data-rec=steps] .runlog{box-sizing:border-box;max-width:100%;overflow:hidden}
.st{min-width:0;max-width:100%;box-sizing:border-box}
.st b{max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stio{overflow-wrap:anywhere;word-break:break-word;max-width:100%}
#log,.col{max-width:100%;overflow-x:clip}
#abox{display:none;width:100%;height:30px;padding:0 8px;margin-bottom:6px;border:0;outline:0;font:inherit;font-size:15.5px;font-style:italic;background:none;color:var(--c-mute);-webkit-user-select:text;user-select:text}
#abox::placeholder{color:var(--c-mute);opacity:.7}
body.acting #abox{display:block}
.thk b{flex:none;font-weight:500}.thk span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.75}
.thk i{flex:none;font-style:normal;font-size:13px}
.thk.open{display:block;padding-top:6px}.thk.open span{display:block;white-space:pre-wrap}.thk.open i{display:none}
.thk.open .thz{margin:8px 0 0 21px;padding-top:8px;border-top:.5px dashed rgba(128,128,128,.35);color:var(--c-ink);opacity:.82}.thk.open .thz.wait{color:var(--c-mute)}
.strec{text-align:center}
.strec>.day{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--c-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12px;color:var(--c-mute)}
.strec>.day svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.strec>.day i{font-style:normal;font-size:13px;transition:transform .2s}.strec.open>.day i{transform:rotate(90deg)}
.strec.note{margin-top:-8px}
.strec .runlog{padding:6px 6px 7px}
.st{display:flex;align-items:baseline;gap:8px;width:100%;padding:7px 8px;border-radius:12px;font-size:13.5px;text-align:left;color:var(--c-ink)}
.st b{flex:none;font-weight:600}.st span{flex:1;min-width:0;color:var(--c-mute)}.st small{flex:none;font-size:11.5px;color:var(--c-mute);font-variant-numeric:tabular-nums}
.st.bad b{color:#d2553f}.st.on{background:rgba(128,128,128,.1)}
.stio{margin:2px 8px 6px;padding:8px 10px;border-radius:10px;background:rgba(128,128,128,.1);font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;color:var(--c-ink);-webkit-user-select:text;user-select:text}
.stio em{display:block;font:11px/1.6 inherit;font-style:normal;color:var(--c-mute)}
.nt{padding:6px 8px;font-size:13.5px;line-height:1.5}.nt small{display:block;font-size:11.5px;color:var(--c-mute)}
.patrec{-webkit-user-select:none;user-select:none}
/* 思考和运行收成一行，点了升起时间线 */
.stl{align-self:flex-start;max-width:100%;min-height:30px;padding:0 6px;display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.55;color:var(--c-mute);text-align:left;border:0;background:none;font-family:inherit}
.stl svg{flex:none;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.stl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stl i{flex:none;font-style:normal;opacity:.6}
#stsShade{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.26);opacity:0;pointer-events:none;transition:opacity .25s}body.stson #stsShade{opacity:1;pointer-events:auto}
#sts{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);border-radius:26px 26px 0 0;background:#fbfcfe;color:var(--c-ink);box-shadow:0 -10px 30px -18px rgba(20,40,80,.45);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1)}
body.stson #sts{transform:none}body.th-b #sts{background:#fffbf9}body.th-d #sts{background:#232a5e}
.sts-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}.sts-h h3{flex:1;margin:0!important;text-align:center}
.sts-x,.sts-tr{flex:none;width:34px;height:34px;border:0;border-radius:17px;background:none;color:var(--c-ink);font:inherit;font-size:17px;display:flex;align-items:center;justify-content:center}
.sts-tr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sts-tr{color:var(--c-mute)}.sts-tr.on{color:#d0743a}
.stl svg.spin{animation:stlspin 1s linear infinite}@keyframes stlspin{to{transform:rotate(360deg)}}
#sts .grab{width:36px;height:5px;border-radius:3px;background:rgba(128,128,128,.35);margin:0 auto 10px}#sts h3{margin:0 0 10px;font-size:15px;font-weight:600}
.sts-l{display:flex;flex-direction:column;gap:2px}
.sts-i{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:none;color:var(--c-ink);font:inherit;font-size:14px;line-height:1.55;text-align:left}
.sts-i:active,.sts-i.on{background:rgba(128,128,128,.1)}.sts-i b{flex:none;font-weight:600;font-size:13px;color:var(--c-mute)}.sts-i span{flex:1;min-width:0;word-break:break-word}.sts-i:not(.on) span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sts-i.on span{white-space:pre-wrap;-webkit-user-select:text;user-select:text}.sts-i small{flex:none;font-size:12px;color:var(--c-mute)}.sts-i.bad b{color:#d0453a}
.sts-i .stio{flex-basis:100%;margin:6px 0 2px;max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.sts-zh{flex-basis:100%;font-size:13.5px;color:var(--c-mute);white-space:pre-wrap;-webkit-user-select:text;user-select:text}

/* 全屏看图、看视频 */
#pv{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 10px calc(env(safe-area-inset-bottom) + 76px)}#pv[hidden]{display:none}
#pv img,#pv video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#pv .pvs{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);min-width:120px;height:42px;padding:0 22px;border:0;border-radius:21px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;font:inherit;font-size:15px}#pv .pvs:disabled{opacity:.6}

.msg.ai>.av{touch-action:manipulation;cursor:pointer}
.av.patting{animation:patw .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes patw{0%{transform:none}25%{transform:translate(-2px,1px) rotate(-14deg) scale(.92)}55%{transform:translate(2px,0) rotate(10deg)}100%{transform:none}}
.pt-in{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;font-size:15px}
.pt-in+.pt-in{box-shadow:inset 0 1px 0 rgba(128,128,128,.14)}
.pt-in span{flex:none;color:var(--c-mute)}.pt-in input{flex:1;min-width:0;height:40px;border:0;outline:0;background:none;font:inherit;color:var(--c-ink);text-align:right;-webkit-user-select:text;user-select:text}
.runlog{margin:8px auto 0;width:88%;text-align:left;padding:12px 14px 13px;border-radius:18px;background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--c-ink);animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.rl-h{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.rl-h small{flex:1;text-align:right;font-size:12px;font-weight:400;color:var(--c-mute);font-variant-numeric:tabular-nums}
.rl-sum{margin-top:2px;font-size:13px;color:var(--c-mute)}
.rl-b{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin-top:10px;padding-top:10px;box-shadow:inset 0 1px 0 rgba(128,128,128,.16);font-size:13.5px;line-height:1.5}
.rl-b span{font-size:12px;line-height:20px;color:var(--c-mute);text-align:right;white-space:nowrap}
.rl-b .sys{grid-column:1/3;font-size:12px;color:var(--c-mute)}
/* 小游戏/组件运行时：从底下升上来一张不透明的面板，盖住输入框；右上角能放大成全屏、再收回（组件也可以自己要求全屏） */
#gshade{position:fixed;inset:0;z-index:6;background:rgba(10,20,40,.26);opacity:0;pointer-events:none;transition:opacity .25s}
body.gaming #gshade,body.gnew #gshade{opacity:1;pointer-events:auto}
#game,#gsheet{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);border-radius:26px 26px 0 0;background:#fbfcfe;color:var(--c-ink);box-shadow:0 -10px 30px -18px rgba(20,40,80,.45);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1),top .34s cubic-bezier(.2,.9,.3,1),border-radius .3s}
body.th-b #game,body.th-b #gsheet{background:#fffbf9}
body.th-d #game,body.th-d #gsheet{background:#232a5e}
#game{max-height:88vh}#game.web{height:70vh}
body.gaming #game,body.gnew #gsheet{transform:none}
#game.full{top:0;height:auto;max-height:none;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 10px)}
#game .grab,#gsheet .grab{flex:none;width:36px;height:5px;border-radius:3px;background:rgba(128,128,128,.3);margin:0 auto 12px}
#game.full .grab{visibility:hidden;margin-bottom:0}
.gm-top{flex:none;display:flex;align-items:center;gap:10px}
.gm-ic{flex:none;width:38px;height:38px;border-radius:13px;background:var(--c-me);color:var(--c-meink);display:grid;place-items:center}
.gm-ic svg,.gm-top button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gm-t{flex:1;min-width:0;line-height:1.25}.gm-t b{display:block;font-size:17px;font-weight:600}.gm-t small{font-size:12.5px;color:var(--c-mute)}
.gm-top button{flex:none;height:34px;min-width:34px;padding:0 13px;border-radius:17px;font-size:14px;background:rgba(128,128,128,.13);color:var(--c-ink);display:grid;place-items:center}
.gm-top #gFull{padding:0}.gm-top #gFull svg{width:17px;height:17px}
.gm-stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:30px 2px 26px}
/* 猜数字：一条 1–100 的尺子，还剩的那一段亮着，越猜越窄 */
.gm-range{position:relative;height:54px}
.gm-range .tr0{position:absolute;left:0;right:0;top:8px;height:10px;border-radius:5px;background:rgba(128,128,128,.16)}
.gm-range .live{position:absolute;top:8px;height:10px;min-width:10px;border-radius:5px;background:var(--c-me);transition:left .5s cubic-bezier(.3,.8,.3,1),width .5s cubic-bezier(.3,.8,.3,1)}
.gm-range .end{position:absolute;top:26px;font-size:12px;color:var(--c-mute)}.gm-range .end.r{right:0}
.gm-range .now{position:absolute;top:24px;transform:translateX(-50%);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;transition:left .5s cubic-bezier(.3,.8,.3,1)}
#game .msg .bub{background:rgba(128,128,128,.12);color:var(--c-ink)}
.gm-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.gm-chips span{height:28px;padding:0 11px;border-radius:14px;background:rgba(128,128,128,.1);font-size:13px;line-height:28px;color:var(--c-mute);font-variant-numeric:tabular-nums}
.gm-chips span b{font-weight:600;color:var(--c-ink);margin-right:4px}
#game .fld,#gsheet .fld{flex:none;margin-top:0}
#game .fld input,#gsheet .fld input{height:48px;border-radius:16px;font-size:16px;background:rgba(128,128,128,.12)}
#game .btn,#gsheet .btn{height:48px;border-radius:16px;margin-top:0;font-size:16px}
#game iframe{flex:1;min-height:0;margin-top:12px;border:0;border-radius:16px;background:#fff}
#game.full iframe{margin:12px -16px calc(-1 * (env(safe-area-inset-bottom) + 20px));border-radius:0}
/* 建群：同一种底部面板。起个名字、勾上要拉进来的 AI */
#gsheet h3{font-size:17px;font-weight:600;margin:0 2px 12px}
.gs-list{margin:12px 0 14px;border-radius:18px;background:rgba(128,128,128,.08);overflow:hidden}
.gs-list .row{height:58px}.gs-list .row span:nth-child(2){line-height:1.25}.gs-list small{display:block;font-size:12px;color:var(--c-mute)}
.gs-list .av{margin:0;flex:none}
.ck{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.4);display:grid;place-items:center;color:transparent;font-size:14px;font-style:normal}
.row.on .ck{background:var(--c-me);box-shadow:none;color:var(--c-meink)}
#gsheet .btn{width:100%}#gsheet .btn[disabled]{opacity:.4}
.row.sub2{height:46px;padding-left:28px;font-size:15px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;margin-top:2px;background:var(--c-glass);color:var(--c-ink)}
.ai .av{background:var(--av,#f0a35e);color:#fff}
.av.pic{background-size:cover!important;background-position:center!important;color:transparent!important;font-size:0}
.row .av.sm{flex:0 0 34px!important;width:34px;height:34px;margin:0;font-size:12px}
body.noav-ai .ai .av,body.noav-me .me .av{display:none}
.col{display:flex;flex-direction:column;gap:6px;max-width:80%;min-width:0;align-items:flex-start}
.me .col{align-items:flex-end}
.bub{padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.6;word-break:break-word;transition:transform .15s,filter .3s}
.bub p+p{margin-top:8px}
.ai .bub{background:var(--c-ai);color:var(--c-aiink);border-bottom-left-radius:6px}
.me .bub{background:var(--c-me);color:var(--c-meink);border-bottom-right-radius:6px}
.bub.press{transform:scale(.97)}
.bub.flash,.actl.flash,.day.flash{filter:brightness(1.18) saturate(1.3)}
/* 无气泡：只有字。我的话靠右、颜色淡一点 */
.plain .bub{background:none!important;padding:0;border-radius:0}
.plain.me .bub{color:var(--c-mute);text-align:right}
.plain.ai .bub{color:var(--c-ink)}
.plain .col{max-width:88%}
/* 动作描写（*……* 包起来的）：斜体、小一号、淡一些，在正文上方。
   分段气泡时它不进气泡，是气泡之间的一行旁白；整段气泡和无气泡时是正文里单独的一行 */
.actl,.bub .act{font-style:italic;font-size:14.5px;line-height:1.5}
.actl{color:var(--c-mute);padding:0 6px;max-width:100%}
.me .actl{text-align:right}
.bub .act{display:block;opacity:.66;margin:1px 0 3px}
.bub .act+.act{margin-top:0}
.rise{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.ch{animation:ch .38s ease-out both}
@keyframes ch{from{opacity:0}}
.q{font-size:13px;line-height:1.4;color:var(--c-mute);padding-left:8px;border-left:2px solid var(--c-mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;max-width:100%}
.tr{font-size:14px;color:var(--c-mute);line-height:1.5;padding:0 4px}
.acts{display:none;align-items:center;gap:2px;color:var(--c-mute);margin:-2px -6px 0}
.msg.open .acts{display:flex;animation:rise .25s ease-out both}
.acts button{width:38px;height:34px;display:grid;place-items:center;border-radius:10px;color:inherit}
.acts svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts .ver{display:flex;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;margin-left:4px}
.acts .ver button{width:26px}
.more{display:none;color:var(--c-mute);font-size:13px;font-weight:700;line-height:12px;height:14px;padding:0 4px;letter-spacing:-.5px;margin:-4px -4px 0;opacity:.7}
.plain .more{display:block}
#foot{position:relative;flex:none;margin:0 16px calc(env(safe-area-inset-bottom) + 18px)}
body.kb #foot{margin-bottom:8px}
#qchip{display:none;align-items:center;gap:8px;background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:14px 14px 4px 4px;padding:8px 6px 8px 12px;margin-bottom:4px;font-size:13px;color:var(--c-mute)}
#qchip.on{display:flex}
#qchip span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qchip button{width:28px;height:24px;font-size:16px;color:var(--c-mute)}
#inp{height:52px;border-radius:26px;background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;align-items:center;gap:8px;padding:0 8px}
body:not([class*="th-"]) #inp,body:not([class*="th-"]) .bar span,body:not([class*="th-"]) .bar button{background:#fff}
#actBtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c-mute);flex:none;font-style:italic;font-size:17px;font-family:Georgia,"Songti SC",serif}
body.acting #actBtn{background:var(--c-me);color:var(--c-meink)}
#plusBtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c-mute);flex:none;font-size:24px;font-weight:300;line-height:1;transition:transform .25s}
body.adding #plusBtn{transform:rotate(45deg)}
/* 「+」点开：从底下升上来一张。上面一排是往对话里放东西（相机、照片、文件），下面是一起做的事（一起听）。以后要加别的也放这里 */
#ashade{position:fixed;inset:0;z-index:6;background:rgba(10,20,40,.22);opacity:0;pointer-events:none;transition:opacity .25s}
#asheet{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);border-radius:26px 26px 0 0;background:var(--c-pop,rgba(255,255,255,.97));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);color:var(--c-ink);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
body.adding #ashade{opacity:1;pointer-events:auto}
body.adding #asheet{transform:none}
#asheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(128,128,128,.35);margin:0 auto 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{height:92px;border-radius:20px;background:rgba(128,128,128,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--c-ink);transition:transform .15s}
.tile:active,.arow:active{transform:scale(.96)}
.tile svg,.arow svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.arow{display:flex;align-items:center;gap:12px;width:100%;height:58px;margin-top:10px;padding:0 16px;border-radius:20px;background:rgba(128,128,128,.12);font-size:16px;color:var(--c-ink);text-align:left;transition:transform .15s}
.arow span{flex:1}
.arow em{font-style:normal;font-size:13px;color:var(--c-mute)}
#box{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;background:none;color:var(--c-ink);-webkit-user-select:text;user-select:text}
#box::placeholder{color:var(--c-mute)}

#send{width:36px;height:36px;border-radius:50%;background:var(--c-me);color:var(--c-meink);display:grid;place-items:center;flex:none;font-size:17px}
body.guest #inp{opacity:.5}
/* 输入框两层：上面打字，下面一排工具。左：+（放东西、一起听）、动作；右：话筒（发语音）、说话（打电话；有字的时候变成发送 ↑） */
#inp{display:block;height:auto;min-height:98px;border-radius:24px;padding:12px 14px 10px}
/* 输入框卡片：玻璃更透一点（饱和 1.7）、一圈 1px 的白边、底下一层很淡的影子 */
#inp{border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 18px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7)}
body.th-d #inp{border-color:rgba(255,255,255,.12);box-shadow:0 2px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
#box{display:block;width:100%;height:30px;padding:0 2px;margin-bottom:8px}
.tools{display:flex;align-items:center;gap:8px}
#plusBtn,#micBtn{width:36px;height:36px;border-radius:50%;background:rgba(128,128,128,.14);color:var(--c-ink);display:grid;place-items:center;flex:none}
#micBtn svg,#send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#actBtn{width:auto;height:36px;padding:0 14px;border-radius:18px;background:rgba(128,128,128,.14);color:var(--c-ink);font-size:14px}
#rec{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:14px;color:#e0564a;visibility:hidden}
#rec i{width:8px;height:8px;border-radius:50%;background:#e0564a;animation:twinkle .7s ease-in-out infinite alternate}
#rec b{font-weight:400;font-variant-numeric:tabular-nums}
body.rec #rec{visibility:visible}
body.rec #micBtn{background:#e0564a;color:#fff}
#send{width:auto;height:38px;padding:0 15px 0 12px;border-radius:19px;display:flex;align-items:center;gap:6px;font-size:15px;background:var(--c-ink);color:#fff;letter-spacing:.02em}
body.th-d #send{color:#1a2046}
#send b{font-weight:600}
body.typed #send{background:var(--c-me);color:var(--c-meink)}
#send i{display:none;font-style:normal;font-size:18px}
body.typed #send{width:38px;padding:0;justify-content:center}
body.typed #send .wv,body.typed #send b{display:none}
body.typed #send i{display:block}
/* 输入框：多行自己长高、附件缩略图一排、TA 回话时发送键变成停、录音时换成一条录音条、按下放光 */
#box{resize:none;line-height:1.6;padding:2px 2px 4px;max-height:160px;overflow-y:auto;font-family:inherit;scrollbar-width:none}
.me .bub p{white-space:pre-wrap}
/* Markdown 气泡（m.md 为真的消息） */
.bub.md{min-width:0;max-width:100%;overflow-wrap:anywhere}
.bub.md>*+*{margin-top:8px}
.bub.md ul,.bub.md ol{padding-left:1.25em}.bub.md li+li{margin-top:3px}.bub.md li.mdsub{margin-left:1.1em}
.bub.md code{font:.88em Menlo,monospace;background:rgba(128,128,128,.15);padding:1px 4px;border-radius:5px}
.bub.md pre{font:12px/1.5 Menlo,monospace;background:rgba(128,128,128,.12);padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-break:break-all;max-width:100%;margin:0;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.bub.md img.mdimg{display:block;max-width:100%;max-height:62vh;border-radius:12px;margin:6px 0;cursor:zoom-in}
.bub.md .mdpre{position:relative;margin:4px 0}.bub.md .mdpre pre{padding-top:26px}
.bub.md .cpb{position:absolute;top:4px;right:6px;padding:2px 9px;border-radius:9px;font-size:12px;line-height:18px;color:var(--c-mute);background:rgba(128,128,128,.14);cursor:pointer}.bub.md .cpb:active{opacity:.5}
.bub.md .mdh{font-weight:600}
.bub.md blockquote{border-left:3px solid rgba(128,128,128,.35);padding-left:9px;opacity:.8}
.bub.md .mdt{overflow-x:auto;max-width:100%}.bub.md table{border-collapse:collapse;font-size:.88em}.bub.md td{border:.5px solid rgba(128,128,128,.35);padding:4px 7px}
.bub.md a{color:inherit;text-decoration:underline}
#atts{display:none;gap:10px;overflow-x:auto;padding:6px 6px 10px;scrollbar-width:none}
#atts.on{display:flex}
.att{position:relative;flex:none;width:60px;height:60px;border-radius:14px;background:rgba(128,128,128,.14) center/cover no-repeat}
.att.f{width:auto;max-width:170px;padding:0 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:13px;color:var(--c-ink)}
.att.f b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att.f small{color:var(--c-mute);font-size:11px}
.att button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:20px;text-align:center}
.pics{display:flex;flex-wrap:wrap;gap:4px;max-width:240px;justify-content:flex-end}
.pics img{width:118px;height:118px;object-fit:cover;border-radius:14px;display:block}
.pics.one img{width:auto;height:auto;max-width:220px;max-height:260px}
.bub.fcard{display:flex;flex-direction:column;gap:2px;max-width:220px}
a.bub.fcard{text-decoration:none;-webkit-touch-callout:none}
/* 长按消息里的字、图片时别弹 iOS 自己的那张菜单（拷贝 / 查询 / 存图），长按只出我们自己的那一排 */
#log,#log *{-webkit-touch-callout:none}
.bub.fcard b{font-weight:500;word-break:break-all}
.bub.fcard small{opacity:.7;font-size:12px}
#send u{display:none;width:13px;height:13px;border-radius:3px;background:currentColor}
body.rec #send,body.busy #send{width:38px;padding:0;justify-content:center}
body.rec #send{background:var(--c-me);color:var(--c-meink)}
body.busy #send{background:rgba(128,128,128,.14);box-shadow:inset 0 0 0 1px rgba(128,128,128,.28);color:var(--c-ink)}
body.rec #send .wv,body.rec #send b,body.busy #send .wv,body.busy #send b,body.busy #send i{display:none}
body.rec #send i{display:block}
body.busy #send u{display:block}
#recbar{display:none;align-items:center;gap:10px;height:30px;padding:0 4px 0 2px;margin-bottom:10px}
body.rec #recbar{display:flex}
body.rec #box,body.rec #abox,body.rec #atts{display:none}
body.rec #rec{visibility:hidden}
body.rec #plusBtn,body.rec #actBtn{opacity:.35;pointer-events:none}
#recX{height:28px;padding:0 12px;border-radius:14px;background:rgba(128,128,128,.14);font-size:13px;color:var(--c-ink);flex:none}
.rw{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;height:26px;overflow:hidden}
.rw i{flex:none;width:3px;height:22px;border-radius:2px;background:#e0564a;transform:scaleY(.2);animation:recw .9s ease-in-out infinite alternate}
@keyframes recw{to{transform:scaleY(1)}}
#recbar b{font-weight:400;font-variant-numeric:tabular-nums;font-size:14px;color:#e0564a;flex:none}
#plusBtn,#actBtn,#micBtn,#send,#recX{transition:transform .15s,box-shadow .25s}
#plusBtn:active,#actBtn:active,#micBtn:active,#send:active,#recX:active{transform:scale(.92);box-shadow:0 0 0 5px color-mix(in srgb,var(--c-me) 18%,transparent),0 0 20px color-mix(in srgb,var(--c-me) 50%,transparent)}
body.adding #plusBtn:active{transform:rotate(45deg) scale(.92)}
#inp{transition:box-shadow .3s}
#inp:focus-within{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c-me) 32%,transparent),0 6px 26px color-mix(in srgb,var(--c-me) 20%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.bub.press{box-shadow:0 0 18px color-mix(in srgb,var(--c-me) 40%,transparent)}
#callbar{display:none;align-items:center;gap:10px;height:74px;padding:0 8px 0 12px;font-size:16px;color:var(--c-ink)}
#callbar i{width:10px;height:10px;border-radius:50%;background:#3fb56b;animation:twinkle .9s ease-in-out infinite alternate}
#callbar span{flex:1}
#callbar b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--c-mute)}
#hang{height:40px;padding:0 20px;border-radius:20px;background:#e0564a;color:#fff;font-size:15px}
/* 通话：全屏，带字幕。左上角 ⌃ 收起，整页往上收走，聊天页顶上留一颗「通话中」的小条，点它再放下来 */
#call{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 34px);color:#fff;background:#f2f2f7;opacity:0;pointer-events:none;transform:scale(1.03);transition:opacity .28s,transform .38s cubic-bezier(.3,.8,.3,1)}
body[class*="th-"] #call{background:var(--sky) center bottom/cover}
body.th-c #call,body:not([class*="th-"]) #call{color:#1c2333}
body.calling #call{opacity:1;pointer-events:auto;transform:none}
body.calling.callmin #call{transform:translateY(-102%);pointer-events:none}
#callMin{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:inherit;font-size:20px;display:grid;place-items:center}
.ck-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.ck-name{font-size:28px;font-weight:700}
.ck-t{font-size:15px;opacity:.8;font-variant-numeric:tabular-nums;margin-bottom:18px}
/* 通话中间那块：一圈跟着声音动的声波。
   一圈竖条排成环：TA 说话时整圈往外跳、中间的光球跟着涨；你说话时光球不动，只有圈里面一层细环在抖。谁在说一眼看得出 */
#wave{width:230px;height:230px;display:block}
#subs{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;height:30vh;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 34%);mask-image:linear-gradient(transparent,#000 34%);margin-bottom:26px}
.sl{font-size:18px;line-height:1.5;text-shadow:0 1px 8px rgba(40,30,80,.45)}
body.th-c .sl,body:not([class*="th-"]) .sl{text-shadow:none}
.sl.me{text-align:right;opacity:.62;font-size:16px}
#hang2{align-self:center;width:72px;height:72px;border-radius:50%;background:#e0564a;color:#fff;display:grid;place-items:center}
#hang2 svg{width:32px;height:32px;transform:rotate(135deg)}
#callPill{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);z-index:5;transform:translate(-50%,-400%);opacity:0;pointer-events:none;transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .2s;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--c-pop,rgba(255,255,255,.97));color:var(--c-ink);font-size:14px;box-shadow:0 8px 20px -10px rgba(20,40,80,.4)}
#callPill i{width:8px;height:8px;border-radius:50%;background:#3fb56b;animation:twinkle .9s ease-in-out infinite alternate}
#callPill b{font-weight:400;color:var(--c-mute);font-variant-numeric:tabular-nums}
body.calling.callmin #callPill{transform:translate(-50%,0);opacity:1;pointer-events:auto}
/* 语音条 */
.plain .bub.vb{padding:10px 14px;border-radius:20px}
.plain.ai .bub.vb{background:var(--c-ai)!important}
.plain.me .bub.vb{background:var(--c-me)!important;color:var(--c-meink)}
.vo{display:flex;align-items:center;gap:8px;min-width:120px;cursor:pointer}.vo.on{opacity:.6}
.vtx,.vsub{font-size:12.5px;line-height:1.5;color:var(--c-mute);padding:2px 6px 0;max-width:100%}.me .vtx,.me .vsub{text-align:right}.vsub.fail{color:#d0453a;cursor:pointer}
.vo svg{width:64px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.vo small{font-size:13px;opacity:.75}
/* 头像裁剪页：选完照片先到这里，拖和放大，圈里的就是头像 */
#avCrop{position:fixed;inset:0;z-index:9000;background:rgba(12,14,22,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top) + 16px) 24px calc(env(safe-area-inset-bottom) + 16px);touch-action:none}
#avCrop .ac-t{color:rgba(255,255,255,.72);font-size:14px}

.dlg-f textarea{display:block;width:100%;min-height:96px;margin-top:14px;border:0;outline:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;resize:none;background:rgba(128,128,128,.13);color:var(--c-ink);-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-10px);background:rgba(17,17,17,.88);color:#fff;font-size:14px;padding:8px 16px;border-radius:18px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:10}

/* 导航页：左上角 ≡ 或从屏幕左边往右划，整页从左盖住聊天页；回聊天页是在导航页右半边往左划。
   上面是常用功能的卡片，下面是原来 Me 页拆开的几项；点一项，那一页从右边进来盖住导航页，要先回到导航页才能回聊天页 */
#edge{position:fixed;left:0;top:0;bottom:0;width:22px;z-index:5;touch-action:none}
#nav,#sub{position:fixed;inset:0;z-index:6;color:var(--c-ink);background:#f2f2f7;transform:translateX(-100%);will-change:transform;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 30px)}
body[class*="th-"] #nav,body[class*="th-"] #sub{background:var(--c-wash),var(--c-wash),var(--sky) center bottom/cover}
#sub{z-index:7;transform:translateX(100%)}
#sedge{position:fixed;left:0;top:0;bottom:0;width:22px;z-index:8;touch-action:none;display:none}
body.subon #sedge{display:block}
.nv-top{display:flex;align-items:center;justify-content:space-between;height:40px;margin-bottom:24px}
.nv-top button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-glass);color:var(--c-ink);font-size:20px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 2px 10px rgba(20,40,80,.08),inset 0 0 0 .5px rgba(255,255,255,.6)}
.nv-top button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}   /* 每页左上角的返回箭头，跟侧边栏那颗一样 */
.nv-date{margin:22px 4px 4px;font-size:14px;color:var(--c-mute)}
.nv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}.nv-head .nv-h{margin-bottom:0}
.nv-btns{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.nv-btns button{height:40px;min-width:40px;border-radius:20px;display:grid;place-items:center;background:var(--c-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--c-ink);box-shadow:0 2px 10px rgba(20,40,80,.08),inset 0 0 0 .5px rgba(255,255,255,.6)}
.nv-btns svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nv-h{margin:0 4px 18px;font-size:32px;font-weight:700;letter-spacing:-.01em}
.nv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:22px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;color:var(--c-ink);transition:transform .15s}
.card:active,.row:active{transform:scale(.97)}
.card.wide{grid-column:1/3;flex-direction:row;align-items:center;min-height:0;gap:12px}
.card .ic{width:36px;height:36px;border-radius:12px;background:var(--c-me);color:var(--c-meink);display:grid;place-items:center;flex:none}
.card svg,.row svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card b{font-size:16px;font-weight:600;display:block}
.card small{font-size:12.5px;color:var(--c-mute);display:block;margin-top:2px}
.nv-sec{margin:26px 6px 8px;font-size:13px;color:var(--c-mute)}
.rows2{background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;height:54px;padding:0 14px;font-size:16px;color:var(--c-ink);text-align:left;transition:transform .15s}
.row+.row{box-shadow:inset 0 1px 0 rgba(128,128,128,.14)}
.row span{flex:1}
.row em{font-style:normal;font-size:14px;color:var(--c-mute)}
.row i{font-style:normal;color:var(--c-mute);font-size:18px}
.nv-out{display:block;margin:22px auto 0;font-size:14px;color:var(--c-mute);padding:8px 16px}
.sb-t{font-size:17px;font-weight:600}
.card{position:relative}
.rm{position:absolute;top:-7px;left:-7px;width:26px;height:26px;border-radius:50%;background:#e0564a;color:#fff;display:none;place-items:center;font-size:20px;line-height:1;font-style:normal}
#nav.edit .rm{display:grid}
#nav.edit .card:not(.wide):not(.add){animation:jig .26s ease-in-out infinite alternate}
#nav.edit .card:nth-child(odd){animation-delay:-.13s}
@keyframes jig{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
#nav:not(.edit) .card.add{display:none}
#navdone{width:auto!important;padding:0 16px;font-size:14px!important;display:none!important}
#nav.edit #navdone{display:grid!important}
.card.add{align-items:center;justify-content:center;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 1.5px var(--c-mute);opacity:.7;color:var(--c-mute);font-size:14px;gap:4px}
.card.add i{font-style:normal;font-size:26px;line-height:1}
.fld{display:flex;gap:8px;margin-top:10px}
.fld input{flex:1;min-width:0;height:44px;border:0;outline:0;border-radius:14px;padding:0 12px;font:inherit;font-size:15px;background:var(--c-glass);color:var(--c-ink);-webkit-user-select:text;user-select:text}
.fld input::placeholder{color:var(--c-mute)}
.fld textarea{flex:1;min-width:0;border:0;outline:0;border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.5;background:var(--c-glass);color:var(--c-ink);-webkit-user-select:text;user-select:text;resize:vertical}
.fld textarea::placeholder{color:var(--c-mute)}
.dlg-x.ap{white-space:pre-wrap;word-break:break-all;text-align:left;max-height:42vh;overflow-y:auto;font-size:13.5px}   /* dsh 的确认卡片：理由、要做的事（参数）照原样排 */
.btn{height:44px;padding:0 18px;border-radius:14px;background:var(--c-me);color:var(--c-meink);font-size:15px;margin-top:10px}
/* 换 AI：点顶上的名字，下面掉出一张小单子 */
.bar #aiBtn{width:auto;height:36px;padding:0 12px;border-radius:18px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;align-items:center;gap:5px;font-size:17px;font-weight:600}
#aiBtn i{font-style:normal;font-size:14px;color:var(--c-mute);transition:transform .2s}
body.aipop #aiBtn i{transform:rotate(180deg)}
#aipop{position:fixed;left:50%;margin-left:-124px;top:calc(env(safe-area-inset-top) + 58px);width:248px;z-index:5;padding:6px;border-radius:22px;background:var(--c-pop,rgba(255,255,255,.97));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);color:var(--c-ink);box-shadow:0 12px 30px -12px rgba(20,40,80,.35);transform-origin:50% 0;transform:scale(.9);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.2,.9,.3,1),opacity .2s}
body.aipop #aipop{transform:none;opacity:1;pointer-events:auto}
#aipop .row{height:54px;border-radius:16px;box-shadow:none}
#aipop .row.cur{background:rgba(128,128,128,.12)}
#aipop .row span:nth-child(2){line-height:1.25}
#aipop small{display:block;font-size:12px;color:var(--c-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aipop .av{margin:0;flex:none}
#aipop{max-height:72vh;overflow-y:auto}
.ap-sec{margin:6px 6px 2px;padding:9px 6px 0;font-size:12px;color:var(--c-mute);box-shadow:inset 0 1px 0 rgba(128,128,128,.16)}
.ap-foot{display:flex;margin-top:6px;box-shadow:inset 0 1px 0 rgba(128,128,128,.16)}
.ap-foot button{flex:1;height:42px;font-size:13.5px;color:var(--c-mute);border-radius:14px}
.ap-foot button+button{box-shadow:inset 1px 0 0 rgba(128,128,128,.16);border-radius:0 14px 14px 0}
/* 群的头像：几个成员的小圆挤在一起（两个斜着放，三个品字，再多只画前三个） */
.gav{position:relative;background:none!important}
.gav i{position:absolute;width:19px;height:19px;border-radius:50%;box-shadow:0 0 0 1.5px var(--ring,#fff)}
.gav i:nth-child(1){left:0;top:0}.gav i:nth-child(2){right:0;bottom:0}
.gav.g3 i{width:16px;height:16px}.gav.g3 i:nth-child(1){left:7px;top:0}.gav.g3 i:nth-child(2){left:0;right:auto;bottom:1px}.gav.g3 i:nth-child(3){right:0;bottom:1px}
body.th-d .gav i{--ring:#262d62}
/* 群里的顶栏：叠着的小头像 + 群名，底下一行小字是成员 */
.bar #aiBtn{max-width:calc(100% - 110px)}
.bar .gavs{flex:none;display:inline-flex;width:auto;height:auto;margin-right:2px;background:none;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.bar .gavs span{display:block;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:600;line-height:21px;text-align:center;color:#fff;border:1.5px solid rgba(255,255,255,.92);-webkit-backdrop-filter:none;backdrop-filter:none}
body.th-d .bar .gavs span{border-color:rgba(40,48,104,.9)}
.bar .gavs span+span{margin-left:-8px}
#ainame{display:flex;align-items:center;gap:6px;min-width:0}
#ainame .gt{min-width:0;text-align:left;line-height:1.15;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ainame .gt small{display:block;font-size:11px;font-weight:400;color:var(--c-mute);overflow:hidden;text-overflow:ellipsis}
/* 群里谁说的：名字写在这条话上面；关了头像时名字前多一颗那个 AI 颜色的小点。同一个 AI 连着说，后面几条不重复名字和头像 */
.msg .who{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--c-mute);margin:0 0 -1px 5px}
.msg .who i{display:none;width:7px;height:7px;border-radius:50%}
body.noav-ai .msg .who i{display:block}
.plain .who{margin-left:0;font-weight:600}
.msg.cont{margin-top:-8px}.msg.cont .who{display:none}.msg.cont .av{visibility:hidden;height:0;margin:0}
/* 容量：聊天页右上角一个小圈（圈是上下文用了多少），点开是上下文、五小时额度、周额度 */
#capBtn svg{width:24px;height:24px;transform:rotate(-90deg)}
#capBtn circle{fill:none;stroke-width:3}
#cap{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 62px);width:256px;z-index:5;padding:16px;border-radius:22px;background:var(--c-pop,rgba(255,255,255,.97));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);color:var(--c-ink);box-shadow:0 12px 30px -12px rgba(20,40,80,.35);transform-origin:100% 0;transform:scale(.9);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.2,.9,.3,1),opacity .2s}
body.cap #cap{transform:none;opacity:1;pointer-events:auto}
#cap h4{font-size:13px;font-weight:400;color:var(--c-mute);margin-bottom:12px}
.cp-r{margin-top:12px}
.cp-r div{display:flex;justify-content:space-between;font-size:14px}
.cp-r div b{font-weight:600}
.cp-r u{display:block;height:6px;border-radius:3px;background:rgba(128,128,128,.2);margin:6px 0 4px;overflow:hidden;text-decoration:none}
.cp-r u i{display:block;height:100%;border-radius:3px;background:var(--c-me)}
.cp-r u i.warn{background:#e0a030}.cp-r u i.hot{background:#e0564a}
.cp-r small{font-size:12px;color:var(--c-mute)}
/* 容量面板里的缓存、带多少 */
#cap{max-height:calc(100dvh - env(safe-area-inset-top) - 90px);overflow-y:auto}
.cp-n{margin-top:14px;font-size:12px;line-height:1.5;color:var(--c-mute)}
.cp-h{margin:16px 0 4px;font-size:13px;color:var(--c-mute)}
.cp-o{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;font-size:14px;color:var(--c-ink);text-align:left}
.cp-o span{flex:1}
.cp-o small{font-size:13px;color:var(--c-mute)}
.cp-o em{width:14px;font-style:normal;color:var(--c-me)}
.cp-o .stp button{width:28px;height:28px;font-size:16px}
.cp-o .stp b{min-width:34px;font-size:14px}
.cp-f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--c-mute);margin-top:2px}
.cp-f span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-f button{font-size:12px;color:var(--c-me);padding:4px 0}
/* 聊天里「从这里开始带给 TA」「带到这里为止」的细分隔线，点了能清掉 */
.cxcut{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;font-size:12px;color:var(--c-mute)}

.acts.cxa{gap:4px;margin-top:2px}
.acts.cxa button{width:auto;height:30px;padding:0 10px;font-size:13px;background:var(--c-glass)}
.godg{display:block;margin-top:6px;font-size:13px;color:var(--c-me)}
.fld.tm label{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--c-mute)}
.fld.tm input{flex:1}
.row .rn{display:block;font-size:12px;color:var(--c-mute);margin-top:2px;line-height:1.3}
/* 主动找我：自己一页。首页先看「开没开、最近来没来」，其余三件事各收成一行，点进去再设 */
.wk-hero{padding:16px 16px 15px;border-radius:22px;background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.wk-hero .top{display:flex;align-items:center;gap:12px}
.wk-hero .top b{flex:1;font-size:18px;font-weight:600;line-height:1.3}
.sw{flex:none;position:relative;width:50px;height:30px;border-radius:15px;background:rgba(128,128,128,.28);transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.8,.3,1)}
.sw.on{background:var(--c-me)}.sw.on::after{transform:translateX(20px)}
body.th-d .sw.on{background:#7f8ff0}
.wk-hero p{margin-top:8px;font-size:13.5px;line-height:1.6;color:var(--c-mute)}
.wk-st{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:12px;box-shadow:inset 0 1px 0 rgba(128,128,128,.16);font-size:13px}
.wk-st i{width:8px;height:8px;border-radius:50%;background:#3fb56b}.wk-st.off i{background:none;box-shadow:inset 0 0 0 1.5px var(--c-mute)}
.kn{display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;padding:13px 14px;align-items:baseline}
.kn+.kn,.kn+.row{box-shadow:inset 0 1px 0 rgba(128,128,128,.14)}
.kn i{width:8px;height:8px;border-radius:50%;background:var(--c-me);align-self:center}
.kn.held i{background:none;box-shadow:inset 0 0 0 1.5px var(--c-mute)}
.kn b{font-size:15.5px;font-weight:500}
.kn time{font-size:12px;color:var(--c-mute);font-variant-numeric:tabular-nums}

.stp{display:flex;align-items:center;gap:4px}

.stp b{min-width:74px;text-align:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.row.tall{height:auto;min-height:60px;padding-top:9px;padding-bottom:9px}
.row .mono{display:block;font-size:12px;color:var(--c-mute);margin-top:2px;word-break:break-all;line-height:1.35}
.wk-off{opacity:.45;pointer-events:none}
/* 搜索：一个框 + 一排收着的筛选（谁说的 / 是什么 / 什么时候 / 在哪找），点一个才列出它的选项 */
.sch-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sch-chips button{height:32px;padding:0 12px;border-radius:16px;font-size:13px;color:var(--c-mute);background:var(--c-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.sch-day{margin:14px 6px 6px;font-size:12px;color:var(--c-mute)}
.sr{display:block;width:100%;text-align:left;padding:11px 14px 12px;color:var(--c-ink);transition:transform .15s}
.sr:active{transform:scale(.98)}
.sr+.sr{box-shadow:inset 0 1px 0 rgba(128,128,128,.14)}

.sb-note{margin:18px 8px;font-size:14px;line-height:1.6;color:var(--c-mute)}
/* 记忆库：首页四个入口，样子借导航页的卡片 */
.mm-sum{margin:4px 6px 14px;font-size:14px;line-height:1.6;color:var(--c-mute)}
.mm-in{display:block;width:100%;min-height:88px;margin-top:6px;border:0;outline:0;border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.5;resize:none;background:var(--c-glass);color:var(--c-ink);-webkit-user-select:text;user-select:text}
.mm-in::placeholder{color:var(--c-mute)}
.mm-seg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 2px 0}

.mm-seg.big button.on{background:var(--c-me)}
.mm-day{margin:18px 6px 6px;font-size:12px;color:var(--c-mute)}
#memList>.rows2{margin-top:12px}
.mm{padding:12px 14px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.mm+.mm{box-shadow:inset 0 1px 0 rgba(128,128,128,.14)}
.mm small{display:block;margin-top:4px;font-size:12px;color:var(--c-mute);white-space:normal}

/* 记忆的关系图（参考 Obsidian 的图谱）：细线、小点、字在点下面；关键词越常用点越大。
   能拖、能两指放大；放大只是把点拉开，点和字不跟着变大，所以挤在一起的放大就散开了。点一个点，跟它连着的亮着，别的退到后面 */
.mnet{position:relative;margin:12px -18px 0;height:58vh;min-height:360px;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,.5),rgba(255,255,255,.16) 70%,rgba(255,255,255,0))}
body.th-d .mnet{background:radial-gradient(120% 90% at 50% 45%,rgba(120,134,230,.16),rgba(120,134,230,.04) 70%,rgba(0,0,0,0))}
.mnet svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mnet line{stroke:var(--c-ink);stroke-opacity:calc(.26*var(--d,1));stroke-width:.8}
.mnet .nd{cursor:pointer;opacity:var(--d,1)}
.mnet .nd .dot{fill:var(--c-ink);fill-opacity:.72;transition:fill .2s}
.mnet .nd.mem .dot{fill:var(--c-mute);fill-opacity:.9}
.mnet .nd.mem.mine .dot{fill:#eda25a;fill-opacity:1}
.mnet .nd circle.hit{fill:transparent}
.mnet .nd circle.halo{fill:var(--c-me);opacity:0;transition:opacity .25s}
.mnet .nd text{font-size:11.5px;fill:var(--c-ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:3px;stroke-linejoin:round;transition:opacity .25s}
body.th-d .mnet .nd text{stroke:rgba(24,30,72,.8)}
.mnet .nd.big text{font-size:13px;font-weight:600}
.mnet .nd.nolab text{opacity:0}
.mnet.sel line{stroke-opacity:.05}
.mnet.sel line.on{stroke:var(--c-me);stroke-opacity:.75;stroke-width:1.1}
body.th-d .mnet.sel line.on{stroke:#aab4ff}
.mnet.sel .nd{opacity:calc(var(--d,1)*.22)}
.mnet.sel .nd.on{opacity:1}.mnet.sel .nd.on text{opacity:1}.mnet.sel .nd:not(.on) text{opacity:0}
.mnet .nd .ring{fill:none;stroke:var(--n-mem,var(--c-mute));stroke-width:1}.mnet .nd.mine .ring{stroke:var(--n-mine,#eda25a)}
.mnet.sel .nd.cur .dot{fill:var(--c-me);fill-opacity:1}
body.th-d .mnet.sel .nd.cur .dot{fill:#aab4ff}
.mnet.sel .nd.cur circle.halo{opacity:.2}
.mnet-home{position:absolute;right:16px;bottom:12px;height:30px;padding:0 12px;border-radius:15px;background:var(--c-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12.5px;color:var(--c-mute);opacity:0;pointer-events:none;transition:opacity .2s}
.mnet.moved .mnet-home{opacity:1;pointer-events:auto}
.mnet-lg{position:absolute;left:18px;bottom:16px;display:flex;gap:10px;font-size:11.5px;color:var(--c-mute);pointer-events:none}
.mnet-lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:var(--c-mute)}
.mnet-lg i.k{width:9px;height:9px;background:var(--c-ink);opacity:.72}.mnet-lg i.m{background:#eda25a}
/* 关系图的几套样子（基础的留着，再加几套「点和线说得通」的美化）：星空 / 深海 / 水墨。
   这几套有自己的底图（现画的），所以是一张圆角的「窗」，不跟着页面的天空变；颜色都走 --n-* */
.mnet[data-skin]:not([data-skin="base"]){margin:12px 0 0;height:60vh;border-radius:26px;background:var(--n-bg)}
.mnet .bg,.mnet .tw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mnet .tw.t1{animation:twinkle 2.6s ease-in-out infinite alternate}.mnet .tw.t2{animation:twinkle 3.7s ease-in-out -1.2s infinite alternate}.mnet .tw.t3{animation:twinkle 5.1s ease-in-out -2.5s infinite alternate}
.mnet[data-skin="sea"] .tw{animation-name:seafloat}
.mnet .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mnet .fx *{transform-box:fill-box;transform-origin:center}
/* 底图上的动效（都是整块慢慢动）：星空 = 两团星云一明一暗地呼吸 + 隔一阵划过一颗流星；深海 = 光柱慢慢摆 + 一串泡泡往上升；水墨 = 两团墨慢慢晕开又收回 */
.fx .neb{mix-blend-mode:screen;animation:nebb 13s ease-in-out infinite alternate}.fx .neb.n2{animation-duration:17s;animation-delay:-6s}
@keyframes nebb{from{opacity:.18;transform:scale(.94) translate(-2%,1%)}to{opacity:.6;transform:scale(1.1) translate(3%,-2%)}}
.fx .met{animation:met 12s linear infinite;opacity:0}.fx .met.m2{animation-duration:19s;animation-delay:-7s}
@keyframes met{0%,86%{opacity:0;transform:translate(0,0)}88%{opacity:.9}100%{opacity:0;transform:translate(-320%,260%)}}
.fx .ray{transform-origin:50% 0;mix-blend-mode:screen;animation:ray 11s ease-in-out infinite alternate}.fx .ray.r2{animation-duration:15s;animation-delay:-5s}.fx .ray.r3{animation-duration:19s;animation-delay:-9s}
@keyframes ray{from{opacity:.04;transform:skewX(-5deg)}to{opacity:.15;transform:skewX(6deg)}}
.fx .bub{animation:bub 18s linear infinite}.fx .bub.b2{animation-duration:26s;animation-delay:-11s}
@keyframes bub{0%{transform:translateY(0);opacity:0}8%{opacity:.55}85%{opacity:.4}100%{transform:translateY(-165px);opacity:0}}
.fx .blot{animation:blot 21s ease-in-out infinite alternate}.fx .blot.k2{animation-duration:29s;animation-delay:-12s}
@keyframes blot{from{opacity:.05;transform:scale(.86)}to{opacity:.16;transform:scale(1.14)}}
@keyframes seafloat{from{opacity:.35;transform:translate(0,6px)}to{opacity:1;transform:translate(5px,-8px)}}

#wel.snap{transition:transform .38s cubic-bezier(.2,.9,.3,1)}
#wel.go{transition:transform .46s cubic-bezier(.4,0,.2,1);transform:translateY(-104%)!important}
.sw{padding-top:calc(env(safe-area-inset-top) + 16px);text-align:right;font-size:12px;color:#c7c7cc}
.sw button{padding:6px 0 6px 12px}
#wel>.sw{display:none!important}   /* 开屏右上角那两个是试样子用的，藏起来；背景、摆件在「外观」里换 */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-size:44px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:17px;color:#8e8e93;margin-top:12px;line-height:1.5;text-indent:2em}
/* 背景：a 晴 b 晚霞 c 晨雾 d 夜，都是渐变。字和按钮的颜色跟着换 */
#wel{touch-action:none;--ink:#111;--mute:#8e8e93;--btn:#111;--btnink:#fff;--faint:#c7c7cc;background-size:cover;background-position:center bottom}
#wel.bg-a{background-image:linear-gradient(#79aae9,#8cb8ee,#a8cbf4,#c6ddf7,#e2edfb);--ink:#fff;--mute:rgba(255,255,255,.86);--btn:#fff;--btnink:#1d3557;--faint:rgba(255,255,255,.7)}
#wel.bg-b{background-image:linear-gradient(#7d81c5,#a38ac5,#d19dbc,#f3baae,#feddc1);--ink:#fff;--mute:rgba(255,255,255,.88);--btn:#fff;--btnink:#5a3a5c;--faint:rgba(255,255,255,.75)}
#wel.bg-c{background-image:linear-gradient(#d2dff5,#d8e3f7,#e4ebf8,#edeff7,#f6f3f4);--ink:#1c2333;--mute:#7c8496;--btn:#1c2333;--btnink:#fff;--faint:#a9b0bf}
#wel.bg-d{background-image:linear-gradient(#131938,#171f45,#222c5d,#3a4078,#565996);--ink:#fff;--mute:rgba(255,255,255,.72);--btn:#fff;--btnink:#161d44;--faint:rgba(255,255,255,.5)}
#sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;isolation:isolate;z-index:0}
/* 天上飘的东西：远处的薄云是一簇簇矢量色块，整簇慢慢左右飘；夜里的星星分三拨，一拨一拨地明暗 */
svg.far{position:absolute;overflow:visible;fill:var(--far);animation:drift 30s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
svg.stars{position:absolute;inset:0;width:100%;height:100%;fill:#fff8e0;animation:twinkle 3s ease-in-out infinite alternate;will-change:opacity}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
#wel>.sw,#wel>.mid{position:relative}
#wel h1{color:var(--ink)}
#wel .sub{color:var(--mute)}
/* 开屏字幕字体：英文 Didot、中文霞鹜文楷（中文前面空两格）。大字是中文问候时也走文楷 */
#wel h1{font-family:Didot,"Bodoni 72","LXGW WenKai",serif;font-weight:400;font-size:35px;letter-spacing:.005em;line-height:1.2}
#wel .sub{font-family:"LXGW WenKai","PingFang SC",serif;font-weight:300;font-size:17px;letter-spacing:.1em}
#wel #login .b1{background:var(--btn);color:var(--btnink)}
#wel #login .b2,#wel .hint,#wel .sw{color:var(--faint)}
/* 开屏：一行一行浮上来 */
h1,.sub,#gate{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.sub{animation-delay:.25s}
#gate{animation-delay:.55s}
@keyframes rise{to{opacity:1;transform:none}}

#gate{position:relative;height:118px}
#login{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .35s}
#login .b1{width:100%;height:54px;border-radius:16px;background:#111;color:#fff;font-size:17px;font-weight:600}
#login .b2{height:44px;padding:0 24px;font-size:15px;color:#8e8e93}
body.in #login{opacity:0;pointer-events:none}

/* 小摆件：盖住登入口。默认是卷帘杆，「外观」里能换成云 */
#orn{position:absolute;left:0;right:0;top:0;height:54px;opacity:0;pointer-events:none;transition:opacity .45s .15s;touch-action:none;cursor:grab}
body.in #orn{opacity:1;pointer-events:auto}
#orn .shape{position:absolute;inset:0;display:none}
.hint{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:12px;color:#c7c7cc;opacity:0;transition:opacity .45s .3s}
body.in .hint{opacity:1}
/* 1 卷帘杆：迎接页是一张卷帘，这是它底下那根杆和拉环，往上一推帘子就卷上去 */
#orn.o1 .s1{display:block}
.s1 i{position:absolute;left:0;right:0;top:0;height:12px;border-radius:6px;background:#111}
.s1 b{position:absolute;left:50%;top:12px;width:2px;height:10px;margin-left:-1px;background:#111}
.s1 u{position:absolute;left:50%;top:21px;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:2.5px solid #111;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
/* 5 平涂的 ☁️：轮廓是 emoji 那种（平底、三个鼓包），有影子，桌宠踩到哪凹到哪 */
#orn.o5 .s5,#orn.o7 .s5{display:block}
.s5 svg{position:absolute;left:0;top:0;width:100%;height:54px;overflow:visible;filter:drop-shadow(0 10px 10px rgba(70,95,130,.22)) drop-shadow(0 0 1.5px rgba(70,95,130,.35))}
/* 7 毛玻璃的云：同一张画布，半透明、淡蓝，一圈细亮边 */
#orn.o7 .s5 svg{filter:drop-shadow(0 10px 14px rgba(70,110,170,.22))}
#orn.o7 #cpath{fill:url(#cgl);stroke:rgba(255,255,255,.95);stroke-width:1.6;paint-order:stroke}
#orn.o7 #cshine{display:block}
#cshine{display:none;fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.2;stroke-linecap:round}

/* 桌宠（默认的小团子，以后可以换）。待机时左右来回走，位置由脚本定 */
#pet{position:absolute;width:46px;height:42px;left:0;top:0;transform-origin:50% 100%;pointer-events:none;z-index:5}
#pet .flip{width:100%;height:100%;transition:transform .18s}
#pet.left .flip{transform:scaleX(-1)}
#pet svg{display:block;width:100%;height:100%;overflow:visible}
#pet .body{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
#pet.walk .body{animation:step .36s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.96)}}
@keyframes step{50%{transform:translateY(-3px) rotate(4deg)}}
#pet .eye{animation:blink 4.6s infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
/*POND-CSS*/
.pond{
  --bg:#f6efe7; --sky1:#f6e2cf; --sky2:#d3e3e6; --sun:#fff6e6; --cl2:#e9d6c6;
  --w1:#a9cbd0; --w2:#86b5bf; --w3:#6a9fae; --deep:#4f8496; --glint:#ffffff;
  --ink:#3b4a55; --mute:#7b8790; --hull:#8f5f49; --hull2:#6b4334; --sail:#fdf7ee; --sail2:#eadfce; --sail3:#d3c5b0;
  --acc:#cf7f90; --leaf:#c9914f; --leaf2:#a8743a; --maple:#c8643f; --post:#7a6657; --card:rgba(255,255,255,.74);

.pond[data-z="1"]{--sky1:#a9d4ef;--sky2:#e6f4ee;--cl2:#c9dfee;--w1:#9fd3d4;--w2:#70bcc2;--w3:#4ea3af;--deep:#2f8394;--hill0:#c9e2e0;--hill1:#a3cfa2;--hill2:#74b182;--tree1:#4f9668;--tree2:#6fae74;--tree3:#a5d08f;--sun:#fffdf2}
.pond[data-z="2"]{--sky1:#f3c898;--sky2:#f5e6d0;--cl2:#eebf95;--w1:#c3c8b9;--w2:#9fb0aa;--w3:#7b979a;--deep:#5c7b80;--hill0:#edd3b4;--hill1:#dfa873;--hill2:#c58455;--tree1:#b5562f;--tree2:#e08a3c;--tree3:#f2c05c;--sun:#ffe6bd}
.pond[data-z="3"]{--sky1:#d3dde6;--sky2:#f0f3f4;--cl2:#c5d0d9;--w1:#c6d5dd;--w2:#a3bccb;--w3:#819fb3;--deep:#5f859b;--hill0:#e6edf1;--hill1:#f6f9fa;--hill2:#dfe8ec;--tree1:#6f8791;--tree2:#eef4f6;--tree3:#ffffff;--sun:#ffffff;--twig:#6d6a6c}
.pond[data-k=b]{
  --bg:#fbfaf7; --sky1:#fbfaf7; --sky2:#fbfaf7; --sun:#fbfaf7; --cl2:#fbfaf7;
  --w1:#fbfaf7; --w2:#f6f4ef; --w3:#f0eee8; --deep:#f0eee8; --glint:#3b4a55;
  --hull:#fbfaf7; --hull2:#fbfaf7; --sail:#fbfaf7; --sail2:#fbfaf7; --sail3:#fbfaf7; --leaf:#fbfaf7; --leaf2:#3b4a55; --maple:#fbfaf7; --post:#fbfaf7;
  --petal:#fbfaf7; --petal2:#fbfaf7; --pad:#fbfaf7; --pad2:#3b4a55; --ice:#fbfaf7; --ice2:#fbfaf7;
  --hill0:#fbfaf7; --hill1:#fbfaf7; --hill2:#fbfaf7; --tree1:#fbfaf7; --tree2:#fbfaf7; --tree3:#fbfaf7; --twig:#3b4a55;
  --card:rgba(255,255,255,.9);
}
.pond[data-k=c]{
  --bg:#161c29; --sky1:#161d2e; --sky2:#33405c; --sun:#f4ecd6; --cl2:#232c44;
  --w1:#2f4a60; --w2:#253e54; --w3:#1c3247; --deep:#0f2233; --glint:#cfe2ee;
  --ink:#e6e9ee; --mute:#8d99a8; --hull:#6f4f42; --hull2:#4f372e; --sail:#ece6da; --sail2:#cfc7b8; --sail3:#aaa294;
  --acc:#e79aa9; --leaf:#b8864d; --leaf2:#946a3a; --maple:#a85a3e; --post:#4d4640; --card:rgba(30,38,54,.78);
  --petal:#e6b3c0; --petal2:#c98a9c; --pad:#55795c; --pad2:#3f5f47; --ice:#dfeef4; --ice2:#a9c6d2;
  --hill0:#2b3550; --hill1:#27324a; --hill2:#1f2a3f; --tree1:#162036; --tree2:#1b2840; --tree3:#22314c; --twig:#3a3540;
}
/* 三层叠着：背景（不动，带笔触）/ 水和船（会动，不加滤镜）/ 最上面一层笔触和纸纹（不动） */
.pond{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:440/500;background:var(--sky2);isolation:isolate}
.pond svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pond #pd-bg,#pd-tex{pointer-events:none} #pd-sv{touch-action:manipulation}
.pond #pd-tex .pd-st{mix-blend-mode:soft-light;opacity:.55} #pd-tex .pd-gr{mix-blend-mode:multiply;opacity:.2}
.pond[data-k=c] #pd-tex .pd-gr{mix-blend-mode:soft-light;opacity:.25}
.pond[data-k=b] #pd-tex,.pond[data-k=b] .pd-soft,.pond[data-k=b] .pd-ov{display:none}
.pond[data-k=b] .pd-rough{filter:none}
.pond[data-k=b] .pd-wat{stroke:var(--ink);stroke-width:1.2;stroke-opacity:.55}
.pond[data-k=b] .pd-sh{stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.pond[data-k=b]{box-shadow:inset 0 0 0 1px rgba(59,74,85,.16)}
.pond .pd-glow{display:none} .pond[data-k=c] .pd-glow{display:block}
.pond .pd-lab{font-size:11.5px;fill:var(--glint);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--deep);stroke-width:3px;stroke-opacity:.5}
.pond .pd-lvl{position:absolute;left:14px;bottom:13px;font-size:12px;color:var(--glint);opacity:.85;letter-spacing:.08em;pointer-events:none}
.pond[data-k=b] .pd-lvl{color:var(--mute)}
.pond .pd-turn{position:absolute;right:10px;bottom:10px;padding:7px 13px;border:0;border-radius:99px;font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pond .pd-turn:active{transform:scale(.95)}

.pond{margin:2px 0 10px}
.nw-fold{display:flex;justify-content:space-between;width:100%;padding:10px 12px;font-size:13px;color:var(--c-mute)}
#nwCap:empty{display:none}
#nwCap{margin-bottom:4px}
/*POND-CSS-END*/
.bub{font-size:var(--fs,16px);border-radius:var(--br,20px)}
/* 主题美化：一张卡，上面是两句话的预览，下面两排色块 */
.sk-card{background:var(--c-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:20px;padding:14px}
.sk-prev{display:flex;flex-direction:column;gap:8px;padding:4px 2px 14px}
.sk-prev .bub{align-self:flex-start;max-width:80%}.sk-prev .bub.r{align-self:flex-end}
.sk-lab{font-size:13px;color:var(--c-mute);margin:8px 2px 8px}
.sk-row{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.sk-row::-webkit-scrollbar{display:none}
.sk-row button,.sk-row label{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);position:relative;display:grid;place-items:center;font-size:12px;color:var(--c-mute);overflow:hidden}
.sk-row .on{box-shadow:0 0 0 2px var(--c-glass),0 0 0 4px var(--c-ink)}
.sk-row label{background:conic-gradient(#f66,#fc6,#6c6,#6cf,#96f,#f6c,#f66)}
.sk-row label input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
/*PET-CSS*/
#ow-sv{position:fixed;inset:0;width:100%;height:100%;display:block;overflow:visible;pointer-events:none;z-index:5}
#ow-c{pointer-events:auto;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#ow-c.drag{cursor:grabbing}
#ow-sv .ln{fill:none;stroke:#2a1a12;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
#ow-sv .dk{fill:#2a1a12}
#ow-sv .sq{stroke-linecap:round;stroke-linejoin:round}
#ow-sv .ft{fill:#e3a456;stroke:#c98a3c;stroke-width:1.2;stroke-linejoin:round}
#ow-sv .wg{stroke:#7d869a;stroke-width:2.5}
body.pet-on #log{padding-bottom:66px}
body.pet-on #pet{visibility:hidden}
/*PET-CSS-END*/

/* —— 样子：a 纸本 b 湖心（默认）c 夜岛 d 线稿；没有 = 白底，这时才用上面的天空背景（晴/晚霞/晨雾/夜/跟着时间）。
   选了 a–d 时 body 带 sk 和 sk-x、不带 th-x，两套不会同时生效。颜色全在变量里：--c-bg 底色，--c-bg2 升上来的那几张底，--c-line 细线，--c-on 按钮上的字。
   「主题美化」里自己挑的气泡颜色写在 body 的 style 上，照样盖过这里 —— */
body.sk-a{--c-bg:#f4eee2;--c-bg2:#faf5ec;--c-line:rgba(91,74,57,.12);--c-ink:#3b3127;--c-mute:#8f806b;--c-ai:#fffaf1;--c-aiink:#3b3127;--c-me:#5b4a39;--c-meink:#fbf4e8;--c-glass:#fffaf1;--c-pop:rgba(255,250,241,.97);--c-on:#fbf4e8;font-family:"LXGW WenKai","PingFang SC",serif}
body.sk-b{--c-bg:linear-gradient(#e4eeee,#eef4f2);--c-bg2:#f5f9f8;--c-line:rgba(29,58,62,.1);--c-ink:#1d3a3e;--c-mute:#5f7d80;--c-ai:#fff;--c-aiink:#1d3a3e;--c-me:#2e6e72;--c-meink:#fff;--c-glass:rgba(255,255,255,.9);--c-pop:rgba(255,255,255,.97);--c-on:#fff}
body.sk-c{--c-bg:#15181d;--c-bg2:#1d2127;--c-line:rgba(233,230,224,.1);--c-ink:#e9e6e0;--c-mute:#9298a2;--c-ai:#22262d;--c-aiink:#e9e6e0;--c-me:#e9e6e0;--c-meink:#15181d;--c-glass:#22262d;--c-pop:rgba(36,40,48,.97);--c-on:#15181d;color:#e9e6e0}
body.sk-d{--c-bg:#fbfbfa;--c-bg2:#fff;--c-line:rgba(21,21,21,.12);--c-ink:#151515;--c-mute:#8a8a8a;--c-ai:transparent;--c-aiink:#151515;--c-me:transparent;--c-meink:#151515;--c-glass:#fff;--c-pop:rgba(255,255,255,.98);--c-on:#fff}
html:has(body.sk-c){background:#15181d}
body.sk,body.sk #chat,body.sk #nav,body.sk #sub,body.sk #call{background:var(--c-bg)}
body.sk #inp,body.sk .bar span,body.sk .bar button{background:var(--c-glass)}
body.sk #sts,body.sk #game,body.sk #gsheet{background:var(--c-bg2)}
body.sk #call{color:var(--c-ink)}body.sk .sl{text-shadow:none}
body.sk-a #send,body.sk-b #send,body.sk-c #send{background:var(--c-me);color:var(--c-meink)}
body.sk-d #send,body.sk-d .btn,body.sk-d .mm-seg button.on,body.sk-d .mm-seg.big button.on{background:var(--c-ink);color:var(--c-on)}
body.sk-d .sw.on{background:var(--c-ink)}
body.sk-a .bub{box-shadow:0 0 0 1px var(--c-line)}
body.sk-b .bub{border-radius:22px}
body.sk-d .ai .bub{border-radius:0!important;border-left:2px solid var(--c-ink);padding:2px 0 2px 12px}
body.sk-d .me .bub{border:1px solid var(--c-ink);border-radius:16px!important}
body.sk-d .pics img{border-radius:6px}
/* 夜岛：原来只给「夜」天空做的深色细节，照样做一份 */
body.sk-c #inp{border-color:rgba(255,255,255,.1);box-shadow:0 2px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
body.sk-c .sw.on{background:#c9c4ba}body.sk-c .sw::after{background:#f3f1ec}
body.sk-c .gav i{--ring:#1d2127}body.sk-c .bar .gavs span{border-color:rgba(29,33,39,.9)}
body.sk-c .mnet{background:radial-gradient(120% 90% at 50% 45%,rgba(200,196,186,.10),rgba(0,0,0,0) 70%)}
body.sk-c .mnet .nd text{stroke:rgba(21,24,29,.85)}
body.sk-c #dlg .dlg-sh{background:rgba(0,0,0,.45)}
body.sk-c #toast{background:rgba(233,230,224,.92);color:#15181d}
body.sk-c .fld input,body.sk-c .fld textarea{color-scheme:dark}
/* 迎接页跟着样子换底色和字色；卷帘杆在深底上换成浅色 */
body.sk-a #wel{background:#f4eee2;--ink:#3b3127;--mute:#8f806b;--btn:#5b4a39;--btnink:#fbf4e8;--faint:#b9ab95}
body.sk-b #wel{background:linear-gradient(#e4eeee,#eef4f2);--ink:#1d3a3e;--mute:#5f7d80;--btn:#2e6e72;--btnink:#fff;--faint:#9fb6b7}
body.sk-c #wel{background:#15181d;--ink:#e9e6e0;--mute:#9298a2;--btn:#e9e6e0;--btnink:#15181d;--faint:#6b717b}
body.sk-d #wel{background:#fbfbfa}
body.sk-c .s1 i,body.sk-c .s1 b{background:#e9e6e0}body.sk-c .s1 u{border-color:#e9e6e0}
/* 聊天正文字体（设置 → 外观 → 字体和水印）：没单独选时 --fbody 不设，跟着页面（纸本是霞鹜文楷，其余是系统字体） */
#log,#box,#abox,#subs{font-family:var(--fbody,inherit)}
/* 水印：聊天背景右下角一行斜字，很淡，颜色跟着样子的字色；在聊天记录底下，不挡字也不挡点 */
#wm{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 150px);max-width:78%;font-size:34px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-ink);opacity:.1;transform:rotate(-8deg);transform-origin:100% 100%;pointer-events:none;user-select:none;-webkit-user-select:none}
#wm[hidden]{display:none}
.fw-pv{font-size:17px}
</style>

<div id="chat">
  <div id="csky"></div><svg id="cbank" preserveAspectRatio="none"></svg><div id="wm" aria-hidden="true" hidden></div>
  <div class="bar"><span id="menu">≡</span><button id="aiBtn"><b id="ainame"></b><i>▾</i></button><button id="capBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="rgba(128,128,128,.28)"/><circle id="capArc" cx="12" cy="12" r="9" stroke="currentColor" stroke-linecap="round"/></svg></button><button id="again" hidden>重来</button></div>

  <button id="hang2" title="挂断"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.600 10.800c1.400 2.800 3.800 5.100 6.600 6.600l2.200-2.200c.300-.300.700-.400 1-.200 1.100.400 2.300.600 3.600.600.600 0 1 .400 1 1V20c0 .600-.400 1-1 1C10.600 21 3 13.400 3 4c0-.600.400-1 1-1h3.500c.600 0 1 .400 1 1 0 1.200.200 2.400.600 3.600.100.300 0 .700-.200 1z"/></svg></button>

    <button class="tile" data-add="照片"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1.500"/><path d="M5 17l4.500-4 3 2.500 3-3L20 16"/></svg>照片</button>

</div>

<div id="wel">
  <div id="sky"></div>
  <div class="sw"><button id="bgswap">换背景</button><button id="swap">换摆件</button></div>
  <div class="mid">
    <h1 id="hello">你好。</h1>
    <p class="sub">这里是你和 AI 说话的地方。</p>
  </div>
  <div id="gate">
    <div id="login">
      <button class="b1" id="b1">登入</button>
      <button class="b2" id="b2">先看看</button>
    </div>
    <div id="orn" class="o1">
      <div class="shape s1"><i></i><b></b><u></u></div>
      <div class="shape s5"><svg id="cloud"><defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfeff"/><stop offset=".5" stop-color="#e9eef6"/><stop offset="1" stop-color="#c9d5e4"/></linearGradient>
        <linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ecf4"/></linearGradient>
        <linearGradient id="cgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(206,224,248,.75)"/><stop offset=".6" stop-color="rgba(226,236,250,.5)"/><stop offset="1" stop-color="rgba(190,212,244,.7)"/></linearGradient>
        <radialGradient id="cs"><stop offset="0" stop-color="rgba(60,85,120,.28)"/><stop offset="1" stop-color="rgba(60,85,120,0)"/></radialGradient>
      </defs><path id="cpath" fill="url(#cg)"/><ellipse id="cdent" rx="22" ry="7" fill="url(#cs)"/><path id="cshine"/></svg></div>
      <div id="pet"><div class="flip">
        <svg viewBox="0 0 46 42">
          <g class="body">
            <path d="M9 13 L12 3 L19 10 Z" fill="#f0a35e"/><path d="M37 13 L34 3 L27 10 Z" fill="#f0a35e"/>
            <path d="M5 28c0-11 8-19 18-19s18 8 18 19c0 9-6 14-18 14S5 37 5 28z" fill="#f0a35e"/>
            <ellipse class="eye" cx="16.5" cy="25" rx="2.3" ry="3" fill="#111"/>
            <ellipse class="eye" cx="29.5" cy="25" rx="2.3" ry="3" fill="#111"/>
            <path d="M20.5 31q2.5 2 5 0" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
          </g>
        </svg>
      </div></div>
    </div>
    <div class="hint">按住往上推</div>
