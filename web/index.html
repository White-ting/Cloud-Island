<script>
const $ = (s) => document.querySelector(s);
const wel = $('#wel'), orn = $('#orn'), pet = $('#pet'), inp = $('#inp');
const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const set = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

// 摆件样子：1 卷帘杆（默认）5 平涂的云 7 毛玻璃的云。l/r = 桌宠能走的范围（占摆件宽度的比例），y = 脚踩的那条线离摆件顶多少
const ORN = { 1: { l: 0, r: 0, y: 2 }, 5: { l: .21, r: .21, y: 14 }, 7: { l: .21, r: .21, y: 14 } };
const PW = 46, PH = 42;
let ornN = +(get('fe-orn6') || 1); if (!ORN[ornN]) ornN = 1;
const h = location.hash.match(/^#in(\d)?/);
if (h && ORN[h[1]]) ornN = +h[1];
else if (get('fe-plain') === '1') ornN = 1;          // 素净版：卷帘杆 + 白底，不动存着的偏好

// 桌宠待机：在一段范围里左右来回走，走一阵停一下
const walk = { min: 0, max: 0, x: 0, top: 0, dir: 1, rest: 0, next: 3, on: true };
function ground(min, max, top, keepX) {
  walk.min = min; walk.max = Math.max(min, max); walk.top = top;
  if (!keepX) walk.x = min + (walk.max - min) * .15;
  walk.x = Math.min(walk.max, Math.max(walk.min, walk.x));
  pet.style.left = walk.x + 'px'; pet.style.top = top + 'px';
}
const ornGround = () => { const o = ORN[ornN], w = orn.clientWidth; ground(w * o.l, w * (1 - o.r) - PW, o.y - PH + 3); };
const ornSet = () => { orn.className = 'o' + ornN; ornGround(); };
ornSet();
const ORN_NAME = { 1: '卷帘杆', 5: '平涂的云', 7: '毛玻璃的云' };
$('#swap').onclick = () => { ornN = { 1: 5, 5: 7, 7: 1 }[ornN]; set('fe-orn6', ornN); ornSet(); cloudDraw(); $('#swap').textContent = '换摆件（' + ORN_NAME[ornN] + '）'; };
$('#swap').textContent = '换摆件（' + ORN_NAME[ornN] + '）';
// 云：上沿 = 几个鼓包 + 桌宠脚下的一个坑。每帧照桌宠的位置重画，桌宠的高度也跟着云面走
const cpath = $('#cpath'), cdent = $('#cdent');
let petOn = true, dent = 0;                                 // dent：坑的深浅 0～1，踩上去慢慢陷、走了慢慢回弹
// 云的样子：上沿是一条顺滑的线，三个鼓包大小不一，最高的偏左，右边矮下去；两头收圆但留着厚度。桌宠踩到哪凹到哪
// ☁️ 的轮廓：底下一条两头圆的长条，上面三个鼓包（左中、中间偏右最大、右小），鼓包之间用圆滑的弧接起来
const EMO = { x0: .14, cw: .72, B: .1, puffs: [[.29, .07, .15], [.55, .11, .21], [.8, .05, .12]] };   // [位置, 圆心抬高, 半径]，都按云宽算
function emoTop(x, w, px) {
  const cw = w * EMO.cw, u = (x - w * EMO.x0) / cw, B = EMO.B;
  if (u < 0 || u > 1) return null;
  const t = u < B ? Math.sqrt(B * B - (B - u) * (B - u)) : u > 1 - B ? Math.sqrt(B * B - (u - 1 + B) * (u - 1 + B)) : B;   // 长条在这里有多厚（一半）
  const K = 45; let sum = Math.exp(K * t);
  for (const [c, z, r] of EMO.puffs) { const dx = u - c; if (Math.abs(dx) < r) sum += Math.exp(K * (z + Math.sqrt(r * r - dx * dx))); }
  const hi = Math.max(t, Math.log(sum) / K - (t < B ? (B - t) * .3 : 0));
  const mid = 52 - B * cw;                                  // 长条的中线；底贴在 52
  const d = px == null ? 0 : 8 * dent * Math.exp(-Math.pow((x - px) / 20, 2));
  return { top: mid - hi * cw + Math.min(d, hi * cw * .5), bot: mid + t * cw };
}
const cloudTop = (x, w, px) => emoTop(x, w, px);
function cloudDraw() {
  if (ornN === 1) return;                                   // 卷帘杆不用画云
  const w = orn.clientWidth, px = petOn ? walk.x + PW / 2 : cloudDraw.lastX;
  cloudDraw.lastX = px;
  let up = '', down = '';
  for (let x = w * .12; x <= w * .88 + .05; x += .5) {
    const c = cloudTop(x, w, px); if (!c) continue;
    up += (up ? 'L' : 'M') + x.toFixed(1) + ' ' + c.top.toFixed(1);
    down = 'L' + x.toFixed(1) + ' ' + c.bot.toFixed(1) + down;
  }
  cpath.setAttribute('d', up + down + 'Z');
  const c = cloudTop(px, w, px) || { top: 20 };
  cdent.setAttribute('cx', px); cdent.setAttribute('cy', c.top + 3); cdent.setAttribute('opacity', dent);
  if (petOn) pet.style.top = (c.top - PH + 5) + 'px';
  if (ornN === 7) {                                         // 玻璃上那道高光：沿着最大的鼓包左上走一小段
    let hl = '';
    for (let u = .4; u <= .56; u += .01) { const x = w * (EMO.x0 + EMO.cw * u), q = cloudTop(x, w, px); hl += (hl ? 'L' : 'M') + x.toFixed(1) + ' ' + (q.top + 7).toFixed(1); }
    $('#cshine').setAttribute('d', hl);
  }
}
cloudDraw();
let tPrev = 0;
function tick(t) {
  const dt = Math.min(.05, (t - tPrev) / 1000 || 0); tPrev = t;
  if (walk.on) {
    if (walk.rest > 0) { walk.rest -= dt; pet.classList.remove('walk'); }
    else {
      pet.classList.add('walk');
      walk.x += walk.dir * 22 * dt; walk.next -= dt;
      if (walk.x >= walk.max) { walk.x = walk.max; walk.dir = -1; }
      if (walk.x <= walk.min) { walk.x = walk.min; walk.dir = 1; }
      if (walk.next <= 0) { walk.rest = 1 + Math.random() * 2; walk.next = 2.5 + Math.random() * 4; if (Math.random() < .3) walk.dir *= -1; }
      pet.classList.toggle('left', walk.dir < 0);
      pet.style.left = walk.x + 'px';
    }
  }
  if (ornN !== 1) { dent += ((petOn ? 1 : 0) - dent) * Math.min(1, dt * (petOn ? 9 : 5)); cloudDraw(); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// —— 主题（背景）：跟着时间自动换，也可以手动定 ——
const BGS = ['auto', 'a', 'b', 'c', 'd', ''], BG_NAME = { auto: '跟着时间', a: '晴', b: '晚霞', c: '晨雾', d: '夜', '': '白底' };
const byClock = () => { const t = new Date().getHours() + new Date().getMinutes() / 60; return t < 5 ? 'd' : t < 8.5 ? 'c' : t < 17 ? 'a' : t < 19.5 ? 'b' : 'd'; };
let bgPick = get('fe-bg2') || '';                    // 默认白底
if (get('fe-plain') === '1') bgPick = '';
const hb = location.hash.match(/bg([a-d])/); if (hb) bgPick = hb[1];
// 一坨不规则的色块（跟云的笔触同一种画法），给远处的薄云、聊天页底下的云堤用。rnd 是固定的随机数，每次打开长得一样
const mul = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function blob(rnd, x, y, len, wid, ang) {
  const p1 = rnd() * 6.28, p2 = rnd() * 6.28, ca = Math.cos(ang), sa = Math.sin(ang); let pts = '';
  for (let i = 0; i < 14; i++) {
    const th = i / 14 * 6.283, e = 1 + .16 * Math.sin(th * 3 + p1) + .09 * Math.sin(th * 5 + p2);
    const a = Math.cos(th) * len / 2 * e, b = Math.sin(th) * wid / 2 * e;
    pts += (x + a * ca - b * sa).toFixed(1) + ',' + (y + a * sa + b * ca).toFixed(1) + ' ';
  }
  return '<polygon points="' + pts + '"/>';
}
function skyBuild(box, th, tops) {
  const rnd = mul(42); let h = '';
  if (th) tops.forEach((top, i) => {                         // 远处的薄云：每簇十几块扁扁的色块
    let g = '';
    for (let k = 0; k < 13; k++) g += blob(rnd, 130 + (rnd() - .5) * 190, 30 + (rnd() - .5) * 22, 50 + rnd() * 70, 12 + rnd() * 16, (rnd() - .5) * .2);
    h += '<svg class="far" viewBox="0 0 260 60" style="left:' + (rnd() * 70 - 15) + '%;top:' + top + '%;width:' + (56 + rnd() * 26) + '%;opacity:' + (th === 'd' ? .55 : .7) + ';animation-duration:' + (24 + i * 7) + 's;animation-delay:-' + (i * 9) + 's">' + g + '</svg>';
  });
  if (th === 'd') for (let s = 0; s < 3; s++) {              // 星星三拨
    let c = '';
    for (let k = 0; k < 22; k++) c += '<circle cx="' + (rnd() * 100).toFixed(1) + '%" cy="' + (rnd() * 72).toFixed(1) + '%" r="' + (.7 + rnd() * 1.1).toFixed(1) + '"/>';
    h += '<svg class="stars" style="animation-duration:' + (2.2 + s * 1.1) + 's;animation-delay:-' + s + 's">' + c + '</svg>';
  }
  box.innerHTML = h;
}
function bankBuild() {                                       // 聊天页底下的云堤：输入框像搁在一层云上
  const rnd = mul(7), sv = $('#cbank'), w = 400; let h = '';
  sv.setAttribute('viewBox', '0 0 ' + w + ' 150');
  for (let k = 0; k < 46; k++) { const x = rnd() * (w + 60) - 30, y = 78 + rnd() * 80; h += '<g fill="var(--bank)" opacity="' + (.28 + rnd() * .3).toFixed(2) + '">' + blob(rnd, x, y, 90 + rnd() * 80, 44 + rnd() * 34, (rnd() - .5) * .3) + '</g>'; }
  sv.innerHTML = h;
}
bankBuild();
// 样子（fe-sk）：b 湖心（默认）a 纸本 c 夜岛 d 线稿；'' = 白底。选了 a–d，天空背景就先不用（两套都管字和气泡的颜色，叠在一起会打架、字会看不清）；
// 样子选「白底」时，下面的「背景」（晴/晚霞/晨雾/夜/跟着时间）才生效。素净版开着时样子也当白底
const SKS = [['b', '湖心', '浅青绿的底，默认'], ['a', '纸本', '米色纸面，正文用霞鹜文楷'], ['c', '夜岛', '深色'], ['d', '线稿', '没有底色，只有线'], ['', '白底', '可以再配下面的天空背景']];
let skPick = get('fe-sk') == null ? 'b' : get('fe-sk'); if (!SKS.some(x => x[0] === skPick)) skPick = 'b';
{ const hk = location.hash.match(/sk([a-d0])/); if (hk) skPick = hk[1] === '0' ? '' : hk[1]; }   // 截图用：#ska … #skd、#sk0 = 白底
const skNow = () => get('fe-plain') === '1' ? '' : skPick;
let bg = '';
const bgSet = () => {
  const sk = skNow();
  bg = sk ? '' : bgPick === 'auto' ? byClock() : bgPick;
  wel.className = wel.className.replace(/\s*bg-\w/g, '') + (bg ? ' bg-' + bg : '');
  document.body.className = document.body.className.replace(/\s*(th|sk)-\w/g, '').replace(/(^|\s)sk(?=\s|$)/g, ' ') + (bg ? ' th-' + bg : '') + (sk ? ' sk sk-' + sk : '');

  $('#bgswap').textContent = '换背景（' + BG_NAME[bgPick] + (bgPick === 'auto' ? '：' + BG_NAME[bg] : '') + '）';
  skyBuild($('#sky'), bg, [7, 17, 27, 58, 68]);
  skyBuild($('#csky'), bg, [12, 40, 66]);
};
bgSet();
$('#bgswap').onclick = () => { bgPick = BGS[(BGS.indexOf(bgPick) + 1) % BGS.length]; set('fe-bg2', bgPick); bgSet(); };
// 问候跟着时间变
{ const t = new Date().getHours(); $('#hello').textContent = t < 5 ? '夜深了。' : t < 11 ? '早上好。' : t < 14 ? '中午好。' : t < 18 ? '下午好。' : '晚上好。'; }
// 开屏字幕（lockwords）：后端 GET api/lockwords?ai= 回 { words: { late_night: [...], dawn: [...], …, zh: { 同一段: [...] } } } 或 { words: null }，
// 一天按北京时间分 8 段、每段几句，进这一段随机挑一句，有中文译文就放在底下一行。先用这台设备上存着的，再去取新的给下次用
//（这次已经画出来的不换，免得一闪）。取不到、后端没有这个接口、没存过，就还是上面那句问候。设置 → 外观 → 开屏字幕里能自己填，或者让 TA 写一套
{ const K = 'fe-lockwords';
  const SLOTS = [[0, 5, 'late_night'], [5, 8, 'dawn'], [8, 11, 'morning'], [11, 13, 'noon'], [13, 17, 'afternoon'], [17, 19, 'dusk'], [19, 22, 'evening'], [22, 24, 'night']];
  let w = null; try { w = JSON.parse(get(K) || 'null'); } catch (e) {}
  const n = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000), h = n.getHours();   // 北京时间
  const slot = (SLOTS.find(([x, y]) => h >= x && h < y) || SLOTS[0])[2], list = w && w[slot];
  if (Array.isArray(list) && list.length) { const i = Math.floor(Math.random() * list.length), zh = ((w.zh || {})[slot] || [])[i];
    $('#hello').textContent = list[i]; const sb = document.querySelector('#wel .sub'); if (sb && zh) sb.textContent = zh; }
  const base = (get('fe-api') || '').trim().replace(/\/+$/, '') || location.pathname.replace(/\/[^/]*$/, '');   // 跟 apiInit 一样：没填后端地址就试网页所在那一层
  const who = get('fe-aicur');                                // 用上次聊的那个 AI 的；第一次打开还不知道是谁，等连上后端、选好 AI 再取（lwPull）
  if (who && /^https?:$/.test(location.protocol)) fetch(base + '/api/lockwords?ai=' + encodeURIComponent(who), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => { if (d && 'words' in d) set(K, d.words && typeof d.words === 'object' ? JSON.stringify(d.words) : null); }).catch(() => {}); }

// AI 叫什么：默认照模型名认出来（Claude、ChatGPT、Gemini、Grok…），认不出就用模型名本身。以后可以让人自己改
let MODEL = 'Opus 4.6';
const aiName = (m) => /claude|opus|sonnet|haiku|fable/i.test(m) ? 'Claude' : /gpt|chatgpt|^o\d/i.test(m) ? 'ChatGPT' : /gemini/i.test(m) ? 'Gemini' : /grok/i.test(m) ? 'Grok' : /deepseek/i.test(m) ? 'DeepSeek' : /qwen|通义/i.test(m) ? '通义千问' : m;
let AI = get('fe-name') || aiName(MODEL);
$('#ainame').textContent = AI;
// —— 聊天（假对话。每条：who、vers 几个版本的回答、cur 现在看第几个、q 引用了谁）——

function isDsh(i) { return !!(LIVE && AIS[i] && AIS[i].kind === 'dsh'); }
// 确认（approval）：dsh 要做越权的事先问。一次弹一个，别的排着；倒计时到了不答，后端当拒绝（会来 approval_end）。点空白处也算拒绝

  const inp = ev.input == null ? '' : typeof ev.input === 'string' ? ev.input : JSON.stringify(ev.input, null, 1);
  const who = (AIS.find(a => a.id === ev.ai) || {}).name || 'TA';
  const txt = () => (ev.reason ? '理由：' + ev.reason + '\n' : '') + (inp && inp !== '{}' ? '要做的：' + (inp.length > 800 ? inp.slice(0, 800) + '…' : inp) + '\n' : '')
    + '\n还剩 ' + Math.max(0, Math.ceil((ev.end - Date.now()) / 1000)) + ' 秒，不答就当拒绝';
  const p = dlg({ title: who + ' 想用「' + (ev.tool || '工具') + '」，行吗？', text: txt(), ok: '允许这一次', no: '拒绝' });
  const x = dlgEl.querySelector('.dlg-x'); x.classList.add('ap');
  const tk = setInterval(() => { if (apCur !== ev) return clearInterval(tk); x.textContent = txt(); if (Date.now() >= ev.end) apEnd(ev.id); }, 1000);
  p.then(v => {
    clearInterval(tk); x.classList.remove('ap'); if (apCur !== ev) return;
    apCur = null; apDone.add(ev.id);
    if (!ev.gone) api('/api/chat/' + encodeURIComponent(ev.ai) + '/approve', { method: 'POST', body: { id: ev.id, allow: v === true } })
      .then(r => toast(r.outcome === 'allowed' ? '允许了这一次' : '拒绝了')).catch(e => toast('没答上：' + e.message));

}

}

  if (!isDsh(i)) return;

}

// 键盘：iOS 拉起键盘时会把整页往上偷推一下，先按回去；整个聊天页贴着「眼睛能看到的那块」（visualViewport），输入框就落在键盘正上方。
